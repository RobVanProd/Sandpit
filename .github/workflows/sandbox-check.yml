name: Verify both sandboxes
on:
  pull_request:
    paths: ['index.html', 'field/index.html', 'verification/*.py', 'verification/*.cjs', '.github/workflows/sandbox-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test drivers
        run: |
          python -m pip install playwright==1.55.0
          npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Exercise both editions
        env:
          CHROME_BIN: /usr/bin/google-chrome
          SANDPIT_CHROMIUM: /usr/bin/google-chrome
          SANDPIT_EVIDENCE: evidence/earthworks
        run: |
          node verification/contact.cjs
          node verification/soil.cjs
          python verification/check.py
          node verification/field.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandpit-browser-evidence
          path: |
            evidence/earthworks/
            captures/
