name: Browser acceptance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  exercise:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.55.0
      - run: node qa/acceptance.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sandpit-browser-evidence
          path: captures/
