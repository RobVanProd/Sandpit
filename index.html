<section class="deck" id="deck"><div id="deckTop"><div class="deckLabel"><b>▰</b> RC TRANSMITTER</div><button id="collapse" aria-label="Collapse transmitter">COLLAPSE ▾</button></div><div class="panel"><div class="fleet" id="fleet"></div><div class="lcdBox"><canvas id="gauges" aria-label="Hydraulic load, payload, traction and battery telemetry"></canvas></div><div class="lcdBox radarBox"><canvas id="radar" aria-label="Water flow radar"></canvas></div></div></section>

<script>
'use strict';
const $=id=>document.getElementById(id), clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), mix=(a,b,t)=>a+(b-a)*t, PI=Math.PI, TAU=PI*2;
const titles=['Divert the Creek','Coordinated Cut & Fill','Free-Play Sandbox'], briefs=['Fill both basins. Keep the camp dry.','Cut a spillway. Haul fill to seal the levee.','Shape the yard. Set the spigot and call in rain.'],names=['Bulldozer','Loader','Dump truck','Excavator'], colors=['#ebab42','#de7844','#9cae73','#e4b640'];
let scenario=0,active=0,view=0,markersOn=true,fine=false,soundOn=false,time=0,flow=.36,rain=false,noticeTime=0,inputType=matchMedia('(pointer:coarse)').matches?'touch':'keyboard';

let seed=124865;function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
// All sand accounts use the same unit: height units of material over one grid cell.

// Transfers debit their donor before crediting their receiver, including carried silt.
const NX=145,NZ=97,N=NX*NZ,DX=32/(NX-1),HX=16,HZ=DX*(NZ-1)/2,AREA=DX*DX;
const field=()=>new Float64Array(N),h=field(),w=field(),silt=field(),wet=new Float32Array(N),pack=new Float32Array(N),rut=new Float32Array(N),qx=field(),qz=field(),limit=field(),dw=field(),ds=field(),vx=new Float32Array(N),vz=new Float32Array(N),foam=new Float32Array(N),fresh=new Float32Array(N),texels=new Float32Array(N*4),detailTex=new Float32Array(N*4);
const source=[-7.8,-9.75],basins=[[8,-5,2.1],[6.3,5,2.15]],camp=[1.6,8.75,1.25],levee=[-3.8,.1],spill=[.1,-3.35],floor=-1.75;
const at=(x,z)=>clamp(Math.round((z+HZ)/DX),0,NZ-1)*NX+clamp(Math.round((x+HX)/DX),0,NX-1);
function sample(a,x,z){const xx=clamp((x+HX)/DX,0,NX-1.0001),zz=clamp((z+HZ)/DX,0,NZ-1.0001),i=Math.floor(zz)*NX+Math.floor(xx),u=xx%1,v=zz%1;return mix(mix(a[i],a[i+1],u),mix(a[i+NX],a[i+NX+1],u),v)}
const river=z=>-7.8+3.2*Math.sin((z+HZ)*.33)+.39*(z+HZ),gauss=(x,z,cx,cz,sx,sz)=>Math.exp(-(((x-cx)/sx)**2)-((z-cz)/sz)**2);
let vehicles=[],tick=0,initialSand=0,waterIn=0,waterOut=0,startWater=0,breaches=0,breachArmed=false,breachMax=0,lastBreach=-100,peakFlow=0,basinFill=[0,0],campDepth=0,goal=false,haul=0,trench=0,seal=0,leakLevel=0,leveeBase=0,spillBase=0,baseCut=0,worked=0,workX=0,workZ=0;
function sum(a){let n=0;for(let i=0;i<a.length;i++)n+=a[i];return n}
function sandTotal(){return (sum(h)+sum(silt)+vehicles.reduce((n,v)=>n+v.payload,0))*AREA}
function channel(earth,x,z,ax,az,bx,bz,width,up,down,bend){let dx=bx-ax,dz=bz-az,along=clamp(((x-ax)*dx+(z-az)*dz)/(dx*dx+dz*dz),0,1);
 let cx=ax+dx*along,cz=az+dz*along+bend*Math.sin(along*PI*2),d=Math.hypot(x-cx,z-cz);
 return mix(earth,Math.min(earth,mix(up,down,along)),Math.exp(-((d/width)**3)))}
function initYard(id){scenario=id;flow=id===1?.49:.36;rain=false;waterIn=waterOut=breaches=breachMax=haul=trench=seal=0;lastBreach=-100;breachArmed=false;goal=false;tick=0;basinFill=[0,0];campDepth=0;leakLevel=0;
 for(const a of [w,silt,wet,pack,rut,qx,qz,vx,vz,foam,fresh])a.fill(0);
 for(let j=0;j<NZ;j++)for(let k=0;k<NX;k++){let x=k*DX-HX,z=j*DX-HZ,i=j*NX+k;
 let earth=.76-.022*z+.12*Math.sin(.64*x+.34*z)+.09*Math.sin(z*1.23-x*.37)+.08*Math.cos(1.41*x+.46*z);
 earth+=2.20*gauss(x,z,-12,-2.5,3.3,4.2)+1.84*gauss(x,z,1.35,-5.5,4.2,2.6)+1.67*gauss(x,z,12,7.3,3.1,3.7)+.75*gauss(x,z,-8,7.5,3.6,2);
 const cx=river(z),dist=Math.abs(x-cx),sw=1.31+.33*Math.cos(z*.64)+1.59*Math.exp(-(((z+6.7)/2.0)**2))+.95*Math.exp(-(((z-.52)/2.42)**2));
 let bottom=-.27-.035*(z+HZ)+.05*Math.sin(z*1.8);
 earth=mix(earth,bottom,Math.exp(-Math.pow(dist/sw,2.62)));earth+=.43*gauss(x,z,-4.3,-6.0,.84,1.42)+.31*gauss(x,z,-6.3,.8,.68,1.30);
 for(const [bx,bz,br] of [...basins,camp]){let radius=Math.hypot(x-bx,(z-bz)*1.14);earth-=.97*Math.exp(-Math.pow(radius/br,3))}
 if(id===1){earth+=.77*gauss(x,z,river(2.75),2.75,1.95,.73);
 earth=channel(earth,x,z,river(.95),.95,6.3,5.0,.90,-.58,-.89,.35);
 earth=channel(earth,x,z,river(-2.65),-2.65,8,-5,.73,-.12,-.48,.16);
 earth+=.89*gauss(x,z,...spill,.51,1.24);
 earth+=1.22*Math.exp(-(((z-levee[1])/.52)**2))*Math.exp(-(((x-levee[0])/2.95)**4));earth-=.53*gauss(x,z,levee[0]+.2,.1,.45,.7)}
 h[i]=Math.max(floor+.1,earth);
 let reach=id===1?-.15:4.7;let surface=.36-.027*(z+HZ),tail=clamp((reach-z)/2.6,0,1);w[i]=dist<sw*1.65?Math.max(0,surface-h[i])*tail:0;wet[i]=clamp(w[i]*3+Math.max(0,1-dist/(sw*1.65))*.28,0,1)}
 vehicles=[[-10.1,4.5,1.43],[3.1,-1.25,-1.2],[10.7,.7,-2.52],[-1.7,5.1,-.52]].map(([x,z,yaw],type)=>({x,z,yaw,type,speed:0,roll:0,pitch:0,y:sample(h,x,z),load:0,slip:0,volts:8.36,payload:0,capacity:[0,15,55,7][type],lift:[.19,.28,.03,.38][type],curl:.45,swing:0,stick:.58,work:0,turn:0,travel:0,antenna:0,antennaV:0,whip:0,lastSpeed:0,head:true,discharge:0}));
 active=0;worked=0;initialSand=sandTotal();startWater=sum(w)*AREA;leveeBase=sample(h,...levee);spillBase=region(h,...spill,.65);baseCut=0;
}
function footprint(x,z,rx,rz,ang,fn){let r=Math.max(rx,rz),c=Math.cos(ang),s=Math.sin(ang);let x0=clamp(Math.ceil((x-r+HX)/DX),0,NX-1),x1=clamp(Math.floor((x+r+HX)/DX),0,NX-1),z0=clamp(Math.ceil((z-r+HZ)/DX),0,NZ-1),z1=clamp(Math.floor((z+r+HZ)/DX),0,NZ-1);

// The solver samples the cutting lip from the very same joint chain we draw.
function toolJoints(v,m){let l=v.lift,cu=v.curl;const j=(base,...args)=>matmul(base,pose(...args));

 if(v.type===1){let base=j(m,0,0,0,-v.turn*.40),arm=j(base,0,1.03,.34,0,.39-l*1.47),tool=j(arm,0,-.15,1.48,0,.12+(.52-cu)*1.72);return {base,arm,tool,lip:[0,-.29,.67]}}
 if(v.type===2){let tool=j(m,0,.98,-1.54,0,-l*.98);return {tool,lip:[0,.09,-.31]}}
 let base=j(m,0,1.15,0,v.swing),reach=1.65+1.4*v.stick+.25*Math.cos(l*2)-.47,rise=-1.44+l*2.64,dist=clamp(Math.hypot(reach,rise),.34,3.149);
